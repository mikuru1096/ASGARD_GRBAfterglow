[build-system]
requires = [
    "setuptools>=68",
    "wheel",
    "numpy>=1.24",
    "meson>=1.2",
    "ninja",
]
build-backend = "setuptools.build_meta"

[project]
name = "asgard-grb-afterglow"
version = "4.2.1"
description = "ASGARD GRB afterglow simulation and fitting toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "License" }
authors = [
    { name = "Jia Ren" },
]
keywords = ["astrophysics", "grb", "afterglow", "fortran", "radiation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "astropy",
    "extinction",
    "h5py",
    "tqdm",
    "charset-normalizer",
]

[project.optional-dependencies]
fit = [
    "emcee",
    "corner",
    "schwimmbad",
    "pymultinest",
]
compare = [
    "afterglowpy==0.8.1",
    "jetsimpy",
    "pandas==2.3.3",
    "pyblastafterglowmag",
    "uncertainties==3.2.3",
    "vegasafterglow==2.0.6",
]

[project.urls]
Homepage = "https://github.com/mikuru1096/ASGARD_GRBAfterglow"

[project.scripts]
asgard-build = "build_extensions:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["asgard_core*", "src*"]

[tool.uv.sources]
jetsimpy = { git = "https://github.com/haowang-astro/jetsimpy.git", rev = "53d07610830f2247d8c41364a2b469491fa22eb2" }
pyblastafterglowmag = { git = "https://github.com/vsevolodnedora/PyBlastAfterglowMag.git", subdirectory = "package", rev = "b0a39d170930908a398de56089fde8cfab16883d" }
